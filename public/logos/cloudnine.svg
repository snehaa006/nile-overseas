  <text x="200" y="356" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" letter-spacing="10" fill="url(#cnGold)">BLANKETS</text>
  <text x="200" y="382" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="2.5" fill="#c9973f">WRAPPED IN WARMTH. CRAFTED IN LUXURY.</text>
