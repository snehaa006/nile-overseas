      <stop offset="0" stop-color="#f4dfa0"/>
      <stop offset="0.45" stop-color="#d9ab55"/>
      <stop offset="0.75" stop-color="#c9973f"/>
      <stop offset="1" stop-color="#e8c877"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#cnGold)">
